# 一体式志愿者服务平台 —— 默认编排（本地开发形态）
# 形态：Redis + MinIO + 自带构建的后端 + Nginx 静态站点
#   MySQL 使用宿主机实例，容器内通过 host.docker.internal 访问
#   敏感信息来自项目根目录 .env（Compose 自动读取）
# 启动：
#   docker compose up -d --build
# 需要自带 MySQL 的完整编排时改用：
#   docker compose -f docker-compose.env.yml up -d --build

services:
  # Redis —— 缓存 / 验证码 / 限流计数 / 权限缓存（应用强依赖）
  redis:
    image: redis:7.4-alpine
    container_name: volunteer-redis
    restart: unless-stopped
    # 仅当 .env 中 REDIS_PASSWORD 非空时启用鉴权
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置：Redis 不允许空密码运行，请在 .env 中配置}
    volumes:
      - redisdata:/data
    # 只绑定回环地址：容器端口不对局域网开放（需要跨机调试时改为 "6379:6379"）
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    networks:
      - volunteer-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO —— 对象存储（API 9090 / 控制台 9091）；官方镜像不含 curl，故不配置 healthcheck
  minio:
    image: minio/minio:latest
    container_name: volunteer-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请检查 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请检查 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    # 只绑定回环地址：MinIO 控制台与 S3 API 不对局域网开放
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9090}:9000"      # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9001"  # Web 控制台
    networks:
      - volunteer-network

  # Spring Boot 后端（镜像内不含明文密钥，全部运行时注入）
  # MySQL 指向宿主机：Windows/macOS 可直接解析 host.docker.internal，Linux 依赖下方 extra_hosts
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: volunteer-backend:2.3.0
    container_name: volunteer-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      # 使 Linux 上的 host.docker.internal 也能解析到宿主机
      - "host.docker.internal:host-gateway"
    environment:
      # ---- 运行环境 ----
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-8081}

      # ---- 数据库（默认指向宿主机 MySQL）----
      # 说明：Compose 的 ${VAR:default} 语法不支持默认值中含冒号（如 JDBC URL 的
      #       "jdbc:mysql://..."），因此这里用 ${VAR} 并在 .env 中提供对应变量。
      #       .env 里为容器形态的连接串（主机名 mysql）；本文件需要的是
      #       host.docker.internal，故使用专用变量 SPRING_DATASOURCE_URL_HOST。
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_HOST}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME 未设置}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD 未设置}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-50MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-100MB}

      # ---- 数据库迁移（Flyway 基线方案）----
      # 容器启动时按 db/migration 迁移；已有库自动建基线并跳过 V1
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      FLYWAY_CLEAN_DISABLED: ${FLYWAY_CLEAN_DISABLED:-true}
      FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-false}

      # ---- Redis（必填：Redis 已强制要求密码）----
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}

      # ---- MinIO（容器内使用服务名）----
      MINIO_ENDPOINT: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 未设置}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 未设置}
      MINIO_BUCKET: ${MINIO_BUCKET:-volunteer}

      # ---- 大模型 ----
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 未设置}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-ada-002}
      LLM_TYPE: ${LLM_TYPE:-deepseek}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60000}

      # ---- 安全密钥 ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，或长度不足 32 字符将导致启动失败}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ENCRYPT_SECRET_KEY: ${ENCRYPT_SECRET_KEY:?ENCRYPT_SECRET_KEY 未设置}

      # ---- 跨域 ----
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}

      # ---- 日志与短信 ----
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_VOLUNTEER: ${LOGGING_LEVEL_COM_VOLUNTEER:-DEBUG}
      LOGGING_LEVEL_ORG_MYBATIS: ${LOGGING_LEVEL_ORG_MYBATIS:-DEBUG}
      SMS_CONSOLE_ENABLED: ${SMS_CONSOLE_ENABLED:-true}
      SMS_PROVIDER_NAME: ${SMS_PROVIDER_NAME:-console}
    ports:
      # 只绑定回环地址：后端 API 不对局域网开放
      - "127.0.0.1:${BACKEND_PORT:-8080}:${SERVER_PORT:-8081}"
    networks:
      - volunteer-network

  # Nginx —— 静态站点 + API/WS 反向代理
  # 前置条件：已执行 cd volunteer-frontend && npm run build:h5
  nginx:
    image: nginx:1.28.3
    container_name: volunteer-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volunteer-frontend/dist/build/h5:/usr/share/nginx/html:ro
    ports:
      # 只绑定回环地址：Nginx 不对局域网开放（需要同网段访问时改为 "80:80"）
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - volunteer-network

volumes:
  redisdata:
  miniodata:

networks:
  volunteer-network:
    driver: bridge
