user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    server_tokens off;

    # ------------------------------------------------------------------
    # 【修复 P2】HSTS 仅在 HTTPS 下发送。
    # 变更前：`add_header Strict-Transport-Security ...` 无条件写在 http 块，
    # 而本配置只监听 80（明文 HTTP）。浏览器收到明文响应上的 HSTS 头会忽略，
    # 属于配置噪音；更糟的是若该站点后来被 https 反代，头会穿透上去。
    # 现在用 map 按 $scheme 判定，只有 https 才发。
    # ---------------------------------------------------------------
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    # ------------------------------------------------------------------
    # 【修复 P2】静态资源缓存分层。
    # 变更前：`location /` 上 `expires 1d; add_header Cache-Control "public, immutable"`
    # 对**包括 index.html 在内的所有文件**生效 —— index.html 被浏览器 immutable 缓存 1 天，
    # 前端每次发版后用户最长 1 天仍加载旧 HTML（旧 HTML 指向已被删除的旧 hash 资源）。
    # 现在：/ 上的长缓存只给 /assets/ 下的内容哈希文件；index.html 与其它路径强制不缓存。
    # 注意 nginx 规则：location 内一旦出现 add_header，server 级的 add_header 会被覆盖，
    # 因此每个自定义 add_header 的 location 都显式重复一遍安全头。
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;
        charset utf-8;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;

        # Vite 产物目录，文件名带内容哈希，可安全长缓存
        location /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # 带哈希的静态子目录（uni-app 输出的 static/）同样长缓存
        location /static/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # 入口 HTML 与其余路径：不缓存，保证发版即时生效
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security $hsts_header always;
        }

        # AI 与导出接口耗时可能超过 60s（llm.timeout 默认 60000ms），
        # 单列更长的读超时，避免 504。
        location /api/ai {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/export {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /ws {
            proxy_pass http://backend:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /doc.html {
            proxy_pass http://backend:8081/doc.html;
            proxy_set_header Host $host;
        }

        location /webjars {
            proxy_pass http://backend:8081/webjars;
            proxy_set_header Host $host;
        }

        location /v3 {
            proxy_pass http://backend:8081/v3;
            proxy_set_header Host $host;
        }

        location /swagger-ui {
            proxy_pass http://backend:8081/swagger-ui;
            proxy_set_header Host $host;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
