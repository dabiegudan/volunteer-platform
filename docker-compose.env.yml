# 一体式志愿者服务平台 —— 环境变量驱动编排（Spring Boot + MySQL + Redis + MinIO）
# 与 docker-compose.yml 的区别：本文件经 .env 注入全部敏感信息，并自带 MySQL。
# 启动：
#   docker compose -f docker-compose.env.yml up -d --build
# 变量来源：项目根目录 .env（Docker Compose 自动读取）
# 语法：${VAR} 缺失时置空并警告；${VAR:?报错} 缺失时直接终止（用于强约束关键密钥）

name: volunteer-platform

services:
  # MySQL 8.0 —— 主数据库（命名卷 mysql-data 持久化；首次创建时执行 MYSQL_* 初始化）
  mysql:
    image: mysql:8.0
    container_name: volunteer-mysql
    restart: unless-stopped
    # 生产可注释掉 ports，仅容器网络内访问更安全
    # 这里只绑定回环地址：数据库不对局域网开放
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请检查 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-volunteer_db}
      MYSQL_USER: ${MYSQL_USER:-volunteer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请检查 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=0
      - --max_connections=300
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - volunteer-net
    healthcheck:
      # mysqladmin 随镜像提供；-h 127.0.0.1 强制走 TCP，避免 socket 假阳性
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # MinIO —— 对象存储；官方镜像不含 curl，因此依赖方使用 service_started
  minio:
    image: minio/minio:latest
    container_name: volunteer-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请检查 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请检查 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      # 只绑定回环地址：MinIO 不对局域网开放
      - "127.0.0.1:${MINIO_API_PORT:-9090}:9000"       # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9001"   # Web 控制台
    volumes:
      - minio-data:/data
    networks:
      - volunteer-net

  # Spring Boot 后端；端口映射 8080(宿主) -> 8081(容器)，与 application.yml 的 server.port 一致
  # 敏感配置全部来自 .env，镜像内不含明文密钥
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: volunteer-backend:2.3.0
    container_name: volunteer-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy     # 等 MySQL 真正可连接
      minio:
        condition: service_started     # MinIO 镜像无 curl，只能等容器启动
      redis:
        condition: service_healthy
    ports:
      # 只绑定回环地址：后端 API 不对局域网开放
      - "127.0.0.1:${BACKEND_PORT:-8080}:${SERVER_PORT:-8081}"
    environment:
      # ---- 运行环境 ----
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-8081}

      # ---- 数据库（容器内主机名为服务名 mysql）----
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME 未设置}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD 未设置}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-20}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}

      # ---- 数据库迁移（Flyway 基线方案）----
      # 本文件的 MySQL 服务通过 MYSQL_DATABASE 自动建库，Flyway 只负责库内迁移
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      FLYWAY_CLEAN_DISABLED: ${FLYWAY_CLEAN_DISABLED:-true}
      FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-false}

      # ---- Redis（必填：Redis 已强制要求密码）----
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
      REDIS_DB: ${REDIS_DB:-0}

      # ---- MinIO（容器内地址为 http://minio:9000）----
      MINIO_ENDPOINT: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 未设置}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 未设置}
      MINIO_BUCKET: ${MINIO_BUCKET:-volunteer}

      # ---- 大模型 ----
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 未设置，AI 功能将不可用}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-ada-002}
      LLM_TYPE: ${LLM_TYPE:-deepseek}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60000}

      # ---- 安全密钥 ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置或过短会导致启动失败}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ENCRYPT_SECRET_KEY: ${ENCRYPT_SECRET_KEY:?ENCRYPT_SECRET_KEY 未设置}

      # ---- 跨域与上传 ----
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-50MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-100MB}

      # ---- 日志与短信 ----
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_VOLUNTEER: ${LOGGING_LEVEL_COM_VOLUNTEER:-DEBUG}
      LOGGING_LEVEL_ORG_MYBATIS: ${LOGGING_LEVEL_ORG_MYBATIS:-DEBUG}
      SMS_CONSOLE_ENABLED: ${SMS_CONSOLE_ENABLED:-true}
      SMS_PROVIDER_NAME: ${SMS_PROVIDER_NAME:-console}
    networks:
      - volunteer-net

  # Redis —— 应用强依赖（验证码 / 限流 / 权限缓存）
  # 若已有外部 Redis，可删除本段并设置 REDIS_HOST / REDIS_PORT / REDIS_PASSWORD 指向外部实例
  redis:
    image: redis:7.4-alpine
    container_name: volunteer-redis
    restart: unless-stopped
    # 容器内用 sh 做条件判断：仅当 REDIS_PASSWORD 非空时才启用鉴权，
    # 避免把 Compose 的 ${VAR:+...} 语法误当作 redis-server 参数
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置：Redis 不允许空密码运行，请在 .env 中配置}
    # 只绑定回环地址：Redis 不对局域网开放
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - volunteer-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  minio-data:
  redis-data:

networks:
  volunteer-net:
    driver: bridge
